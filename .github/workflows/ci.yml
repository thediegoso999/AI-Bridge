name: AI-Bridge CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verificar:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 5

    steps:
      - name: Obtener codigo
        uses: actions/checkout@v4

      - name: Preparar Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Preparar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Comprobar sintaxis
        run: |
          python -m compileall -q aibridge tests
          node --check aibridge/web/app.js

      - name: Ejecutar pruebas
        shell: bash
        run: |
          python - <<'PY'
          import sys
          import unittest
          from pathlib import Path

          if not Path("tests").is_dir():
              raise SystemExit("No existe el directorio tests/.")

          suite = unittest.defaultTestLoader.discover("tests", pattern="test*.py")
          test_count = suite.countTestCases()
          if test_count == 0:
              raise SystemExit("No se encontraron pruebas unittest.")

          print(f"Pruebas encontradas: {test_count}")
          result = unittest.TextTestRunner(verbosity=2).run(suite)
          sys.exit(not result.wasSuccessful())
          PY
